<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" version="1.1">
  <defs>
    <!-- 头部南大家园天青微渐变 (#38BDF8 -> #0099FF) -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <!-- 经典红苹果微渐变 -->
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- 蛇身方块微阴影 (强化层叠立体感) -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0099FF" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- 1. 南大家园纯白超椭圆底座与极细浅灰边线 -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- 2. 南大家园四色微点 (左上角标志) -->
  <circle cx="8" cy="7.5" r="1.4" fill="#0099FF" />
  <circle cx="12" cy="7.5" r="1.4" fill="#F59E0B" />
  <circle cx="16" cy="7.5" r="1.4" fill="#10B981" />
  <circle cx="20" cy="7.5" r="1.4" fill="#EC4899" />

  <!-- 3. 反 Z 字型重叠方块贪吃蛇 (左上起步 ➔ 沿对角斜折 ➔ 右下昂首冲刺) -->
  <!-- 节0: 蛇尾 (左上段浅淡冰蓝) -->
  <rect x="8" y="14.5" width="8.5" height="8.5" rx="2.5" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 节1: 左上段水平向右 (柔和天青蓝，微重叠压在节0上) -->
  <rect x="14" y="14.5" width="8.5" height="8.5" rx="2.5" fill="#7DD3FC" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 节2: 反 Z 字斜向中枢折角节 (清澈亮蓝，向下微移压叠) -->
  <rect x="18" y="22.5" width="8.5" height="8.5" rx="2.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 节3: 右下段水平转折节 (深邃天蓝) -->
  <rect x="22" y="30.5" width="8.5" height="8.5" rx="2.5" fill="#0284C7" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 节4: 蛇头 (南大家园天青渐变方块，压叠在最顶层) -->
  <rect x="28" y="30.5" width="9.2" height="9.2" rx="2.8" fill="url(#headGrad)" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 蛇头灵动双眸 (专注注视右方目标红苹果) -->
  <!-- 上眼 -->
  <circle cx="34" cy="33.1" r="1.4" fill="#FFFFFF" />
  <circle cx="34.5" cy="33.1" r="0.75" fill="#0F172A" />
  <circle cx="34.2" cy="32.7" r="0.3" fill="#FFFFFF" />
  <!-- 下眼 -->
  <circle cx="34" cy="37.1" r="1.4" fill="#FFFFFF" />
  <circle cx="34.5" cy="37.1" r="0.75" fill="#0F172A" />
  <circle cx="34.2" cy="36.7" r="0.3" fill="#FFFFFF" />

  <!-- 4. 经典多巴胺红苹果与翠绿果叶 (位于蛇头正前方) -->
  <circle cx="41" cy="35" r="3.6" fill="url(#appleGrad)" />
  <circle cx="39.8" cy="33.6" r="1.0" fill="#FFFFFF" opacity="0.65" />
  <!-- 果梗 -->
  <rect x="40.5" y="29.8" width="0.9" height="1.8" rx="0.4" fill="#78350F" />
  <!-- 翠绿嫩叶 -->
  <path d="M41 30.6 C42.6 29.2 43.8 29.8 43.4 31.0 C42.2 31.5 41.5 30.9 41 30.6 Z" fill="#10B981" />

  <!-- 5. 金色幸运星闪烁点缀 (右上角呼应，达成黄金分割平衡) -->
  <path d="M37.5 12 L38.3 14.0 L40.5 14.2 L38.8 15.5 L39.4 17.5 L37.5 16.4 L35.6 17.5 L36.2 15.5 L34.5 14.2 L36.7 14.0 Z" fill="#F59E0B" />
</svg>
