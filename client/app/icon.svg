<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" version="1.1">
  <defs>
    <!-- 南大家园天青蓝微渐变 -->
    <linearGradient id="headCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <!-- 经典红苹果微渐变 -->
    <linearGradient id="appleRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- 1. 南大家园超椭圆纯净底座 (纯白 + 极薄浅灰细边线) -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- 2. 南大家园四色微点 (左上角) -->
  <circle cx="8.5" cy="8.5" r="1.5" fill="#0099FF" />
  <circle cx="12.5" cy="8.5" r="1.5" fill="#F59E0B" />
  <circle cx="16.5" cy="8.5" r="1.5" fill="#10B981" />
  <circle cx="20.5" cy="8.5" r="1.5" fill="#EC4899" />

  <!-- 3. 经典方块状天青蓝贪吃蛇 (一眼即识的经典网格方格形态) -->
  <!-- 蛇尾 (浅淡天青蓝方块) -->
  <rect x="8" y="29.5" width="7.5" height="7.5" rx="2.2" fill="#BAE6FD" />
  <!-- 蛇身转角1 (中浅天青蓝方块) -->
  <rect x="8" y="19.5" width="7.5" height="7.5" rx="2.2" fill="#7DD3FC" />
  <!-- 蛇身转角2 (明亮天青蓝方块) -->
  <rect x="18" y="19.5" width="7.5" height="7.5" rx="2.2" fill="#38BDF8" />
  <!-- 蛇头 (南大家园天青主色渐变圆角方块) -->
  <rect x="18" y="29.5" width="8" height="8" rx="2.4" fill="url(#headCyanGrad)" />

  <!-- 蛇头灵动双眸 (朝向右侧正在觅食) -->
  <!-- 上眼 -->
  <circle cx="23.2" cy="31.8" r="1.5" fill="#FFFFFF" />
  <circle cx="23.6" cy="31.8" r="0.75" fill="#0F172A" />
  <circle cx="23.3" cy="31.4" r="0.3" fill="#FFFFFF" />
  <!-- 下眼 -->
  <circle cx="23.2" cy="35.2" r="1.5" fill="#FFFFFF" />
  <circle cx="23.6" cy="35.2" r="0.75" fill="#0F172A" />
  <circle cx="23.3" cy="34.8" r="0.3" fill="#FFFFFF" />

  <!-- 4. 经典正圆红苹果与果叶 (蛇头正前方的目标) -->
  <circle cx="34.5" cy="33.5" r="4.2" fill="url(#appleRedGrad)" />
  <circle cx="33.2" cy="31.8" r="1.2" fill="#FFFFFF" opacity="0.65" />
  <!-- 果梗 -->
  <rect x="34.0" y="27.5" width="1.0" height="2.2" rx="0.5" fill="#78350F" />
  <!-- 翠绿果叶 -->
  <path d="M34.5 28.5 C36.5 26.5 38 27.5 37.5 29 C36.2 29.5 35.2 28.8 34.5 28.5 Z" fill="#10B981" />

  <!-- 5. 金色幸运星点缀 (右上角，象征 +30 幸运金果机制) -->
  <path d="M34.5 11 L35.6 13.8 L38.5 14.0 L36.2 15.8 L37.0 18.5 L34.5 17.0 L32.0 18.5 L32.8 15.8 L30.5 14.0 L33.4 13.8 Z" fill="#F59E0B" />
</svg>
