<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" version="1.1">
  <defs>
    <!-- 天青蓝渐变 (#66CCFF -> #0099FF) -->
    <linearGradient id="ncuCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66CCFF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <!-- 珊瑚红苹果渐变 -->
    <linearGradient id="appleRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- 1. 纯白极简圆角底板与浅灰细边线 -->
  <rect width="32" height="32" rx="7.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- 2. 南大家园四色多巴胺微徽标 (左上角) -->
  <circle cx="6.5" cy="6.5" r="0.9" fill="#66CCFF" />
  <circle cx="9.0" cy="6.5" r="0.9" fill="#F59E0B" />
  <circle cx="11.5" cy="6.5" r="0.9" fill="#10B981" />
  <circle cx="14.0" cy="6.5" r="0.9" fill="#EC4899" />

  <!-- 3. 几何蛇身 (渐次天青蓝骨骼) -->
  <rect x="6.0" y="20.5" width="5.0" height="5.0" rx="1.6" fill="#BAE6FD" />
  <rect x="6.0" y="14.0" width="5.0" height="5.0" rx="1.6" fill="#7DD3FC" />
  <rect x="12.5" y="14.0" width="5.0" height="5.0" rx="1.6" fill="#38BDF8" />

  <!-- 4. 天青蓝蛇头 (#66CCFF 主色 + 灵动双眸) -->
  <rect x="12.5" y="20.5" width="5.5" height="5.5" rx="1.8" fill="url(#ncuCyanGrad)" />
  <!-- 双眸 -->
  <circle cx="16.0" cy="22.5" r="1.1" fill="#FFFFFF" />
  <circle cx="16.3" cy="22.5" r="0.55" fill="#0F172A" />
  <circle cx="15.8" cy="22.1" r="0.25" fill="#FFFFFF" />

  <!-- 5. 珊瑚红苹果与极简嫩叶芽 -->
  <circle cx="23.5" cy="16.5" r="2.8" fill="url(#appleRedGrad)" />
  <ellipse cx="22.5" cy="15.3" rx="1.0" ry="0.5" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 22.5 15.3)" />
  <path d="M23.5 13.8 C24.5 12.8 25.4 13.2 25.1 14.1 C24.4 14.3 23.8 14.0 23.5 13.8 Z" fill="#10B981" />

  <!-- 6. 金色幸运星闪烁点缀 (右上角) -->
  <circle cx="23.5" cy="8.0" r="1.1" fill="#F59E0B" />
</svg>

