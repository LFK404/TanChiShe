<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32" width="32" height="32" version="1.1">
  <defs>
    <!-- 果实水晶强光泽 (Tier 1) -->
    <radialGradient id="appleCrystal" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFA8BA" />
      <stop offset="25%" stop-color="#FF4D6D" />
      <stop offset="70%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>

    <!-- 蛇头亚克力柔光 (Tier 2) -->
    <linearGradient id="headAcrylic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="40%" stop-color="#66CCFF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- 1. 纯白极简圆角底板与浅灰细边框 -->
  <rect width="32" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- 2. 蛇身 4 节 (Tier 3 纯净哑光) -->
  <rect x="6.5" y="19.5" width="5.5" height="5.5" rx="2" fill="#BAE6FD" />
  <rect x="6.5" y="13.0" width="5.5" height="5.5" rx="2" fill="#7DD3FC" />
  <rect x="6.5" y="6.5" width="5.5" height="5.5" rx="2" fill="#38BDF8" />
  <rect x="13.0" y="6.5" width="5.5" height="5.5" rx="2" fill="#00B4D8" />

  <!-- 3. 蛇头 (Tier 2 天青蓝 #66CCFF 亚克力中度光泽) -->
  <rect x="13.0" y="13.0" width="5.5" height="5.5" rx="2" fill="url(#headAcrylic)" />
  <rect x="13.8" y="13.6" width="3.9" height="1.1" rx="0.55" fill="#FFFFFF" opacity="0.42" />
  <!-- 灵动双眸 -->
  <circle cx="16.8" cy="15.0" r="1.1" fill="#FFFFFF" />
  <circle cx="17.1" cy="15.0" r="0.6" fill="#0F172A" />
  <circle cx="16.7" cy="14.7" r="0.28" fill="#FFFFFF" />

  <!-- 4. 鲜红水晶苹果 (Tier 1 双重强镜面高光与透光) -->
  <circle cx="22.5" cy="19.5" r="2.75" fill="url(#appleCrystal)" />
  <ellipse cx="21.4" cy="18.2" rx="1.15" ry="0.55" fill="#FFFFFF" opacity="0.9" transform="rotate(-30 21.4 18.2)" />
  <circle cx="23.2" cy="18.0" r="0.35" fill="#FFFFFF" opacity="0.85" />
  <ellipse cx="23.2" cy="20.7" rx="1.1" ry="0.4" fill="#FFA4B6" opacity="0.45" transform="rotate(15 23.2 20.7)" />

  <!-- 嫩绿微叶与果蒂 -->
  <path d="M22.5 16.7 C23.6 15.6, 24.8 16.0, 24.5 17.1 C23.6 17.4, 22.9 17.0, 22.5 16.7 Z" fill="#22C55E" />
  <path d="M22.5 17.2 Q22.2 16.4 21.9 16.0" stroke="#78350F" stroke-width="0.6" stroke-linecap="round" fill="none" />

  <!-- 5. 右上角微小金色幸运星点缀 -->
  <circle cx="23.5" cy="8.5" r="1.0" fill="#F59E0B" opacity="0.9" />
</svg>
