<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" version="1.1">
  <defs>
    <!-- 头部 NCU HOME 天青微渐变 (#38BDF8 -> #0099FF) -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <!-- 经典红苹果微渐变 -->
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- 蛇身方块微阴影 (层叠微立体软影) -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#0099FF" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 1. NCU HOME 纯白超椭圆底座与极细浅灰边线 -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- 2. NCU HOME 四色微标 (顶部点睛) -->
  <circle cx="11" cy="7.5" r="1.3" fill="#0099FF" />
  <circle cx="15" cy="7.5" r="1.3" fill="#F59E0B" />
  <circle cx="19" cy="7.5" r="1.3" fill="#10B981" />
  <circle cx="23" cy="7.5" r="1.3" fill="#EC4899" />

  <!-- 3. 灵动曲折层叠方块贪吃蛇 (第3节往上提、第5节往下沉，蜿蜒生动) -->
  <!-- 节0: 蛇尾 (左下方起始，浅淡冰蓝) -->
  <rect x="7.5" y="33" width="8" height="8" rx="2.4" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 节1: 底横微抬节 (天青淡蓝，平滑向上微过渡) -->
  <rect x="13.5" y="31" width="8" height="8" rx="2.4" fill="#93C5FD" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 节2: [尾巴第3个方块 往上提一点] (清澈水蓝，打破死板直线) -->
  <rect x="19.5" y="26.5" width="8" height="8" rx="2.4" fill="#60A5FA" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 节3: 中枢过渡节 (明亮天青蓝，灵动折转) -->
  <rect x="14" y="21" width="8" height="8" rx="2.4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 节4: [尾巴第5个方块 往下沉一点] (纯正天蓝，打破顶线生硬感) -->
  <rect x="9.5" y="17.5" width="8" height="8" rx="2.4" fill="#0284C7" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 节5: 顶横向上攀升节 (深天蓝) -->
  <rect x="16.5" y="14.5" width="8" height="8" rx="2.4" fill="#0099FF" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 节6: 蛇头 (右上方顶层方块，NCU HOME 渐变，昂首朝右) -->
  <rect x="24" y="14.5" width="8.8" height="8.8" rx="2.6" fill="url(#headGrad)" stroke="#FFFFFF" stroke-width="0.8" filter="url(#tileShadow)" />

  <!-- 蛇头灵动双眸 (专注注视右上前方红苹果) -->
  <!-- 上眼 -->
  <circle cx="29.8" cy="17.2" r="1.4" fill="#FFFFFF" />
  <circle cx="30.3" cy="17.2" r="0.75" fill="#0F172A" />
  <circle cx="30.0" cy="16.8" r="0.3" fill="#FFFFFF" />
  <!-- 下眼 -->
  <circle cx="29.8" cy="21.0" r="1.4" fill="#FFFFFF" />
  <circle cx="30.3" cy="21.0" r="0.75" fill="#0F172A" />
  <circle cx="30.0" cy="20.6" r="0.3" fill="#FFFFFF" />

  <!-- 4. 经典多巴胺红苹果与翠绿果叶 (位于右上方蛇头正前方) -->
  <circle cx="38.5" cy="19" r="3.6" fill="url(#appleGrad)" />
  <circle cx="37.3" cy="17.6" r="1.0" fill="#FFFFFF" opacity="0.65" />
  <!-- 果梗 -->
  <rect x="38.0" y="13.8" width="0.9" height="1.8" rx="0.4" fill="#78350F" />
  <!-- 翠绿嫩叶 -->
  <path d="M38.5 14.6 C40.1 13.2 41.3 13.8 40.9 15.0 C39.7 15.5 39.0 14.9 38.5 14.6 Z" fill="#10B981" />

  <!-- 5. 金色幸运星点缀 (右下方空位平衡，呼应 +30 金果) -->
  <path d="M37.5 33 L38.3 35.0 L40.5 35.2 L38.8 36.5 L39.4 38.5 L37.5 37.4 L35.6 38.5 L36.2 36.5 L34.5 35.2 L36.7 35.0 Z" fill="#F59E0B" />
</svg>
